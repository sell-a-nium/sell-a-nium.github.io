<!doctype html>
<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <title>Course Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1 id="title"></h1>
      <div class="topbar-right">
        <span class="signature">Andrio</span>
        <button id="themeToggle">🌙</button>
      </div>
    </header>

    <div class="layout">
      <div class="videoArea">
        <div class="playerContainer">
          <iframe id="playerFrame" allowfullscreen></iframe>
        </div>

        <div class="videoHeader">
          <div id="videoTitle"></div>
        </div>

        <div class="navButtons">
          <button id="prevBtn">◀ Previous</button>
          <button id="nextBtn">Next ▶</button>
          <a id="downloadBtn" target="_blank">⬇ Download</a>
        </div>

        <div class="navButtons">
          <button id="prevBtn">◀ Previous</button>
          <button id="nextBtn">Next ▶</button>
        </div>

        <div id="docs"></div>
      </div>

      <div id="playlistContainer">
        <div class="searchBar">
          <input type="text" id="search" placeholder="Search lectures..." />
          <button id="toggleAll">Expand All</button>
        </div>

        <div id="noResults">No results found</div>

        <div id="playlist"></div>
      </div>
    </div>

    <script src="player.js"></script>
  </body>
</html>
